app = "publicautoinsta-api"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  GRAPH_API_BASE_URL = "https://graph.instagram.com"
  GRAPH_API_VERSION = "v25.0"
  PUBLIC_BASE_URL = "https://publicautoinsta-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  processes = ["app"]

[[mounts]]
  source = "planner_data"
  destination = "/data"
  initial_size = "1GB"
  snapshot_retention = 7

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
